<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Košík matrix</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div class="wrap wide">
  <header>
    <h1>Košík<small>shelf prices across stores — cheapest per unit marked</small></h1>
    <nav><a href="./" aria-current="page">Matrix</a><a href="match.html">Match</a><a href="list.html" id="navList">List</a></nav>
  </header>
  <div class="meta" id="meta"></div>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
  <p class="note" id="note"></p>
</div>
<script>
const CZK = n => n.toLocaleString("cs-CZ",{minimumFractionDigits:Number.isInteger(n)?0:2, maximumFractionDigits:2}) + " Kč";
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA=null, CAT="all", LIVE=false;  // LIVE = served by pricetrack.py (list works)

function apply(d){
  DATA=d;
  document.getElementById("meta").textContent =
    "Updated " + d.generated.replace("T"," ") + " · " + d.rows.length + " rows × " + d.stores.length + " stores";
  buildFilters(); render();
  document.getElementById("note").textContent =
    "Cells show the shelf price (VAT included) with pack size and price per unit underneath. "
    + "Green = cheapest per unit in the row, so different pack sizes compare fairly. akce = promo, often time-limited; requires card = loyalty-card price "
    + "(hover for which card). Store columns come from the stores directly; the flyer column is the best current "
    + "flyer deal across all chains, found by the weekly kupi.cz crawl. "
    + (LIVE ? "Tap a price to put that item on your shopping list at that store (tap again to take it off; "
             + "tapping another store moves it). ↗ opens the store's page." : "");
}
async function load(){
  try{
    // live from `pricetrack.py serve`, else the last export
    let r = await kosikFetch("matrix").catch(()=>null);
    LIVE = !!(r && r.ok);
    if(!LIVE) r = await fetch("prices.json?"+Date.now());
    apply(await r.json());
  }catch(e){
    document.getElementById("list").innerHTML =
      `<div class="loader">Opened as a local file, so the browser won't auto-load the data.<br>
       <label>Choose prices.json<input id="fp" type="file" accept="application/json" hidden></label>
       &nbsp;— or serve it: <code>cd dashboard &amp;&amp; python3 -m http.server</code> then open localhost:8000</div>`;
    document.getElementById("fp").onchange = ev=>{
      const f=ev.target.files[0]; if(!f) return;
      const r=new FileReader(); r.onload=()=>{ try{apply(JSON.parse(r.result));}catch(_){ } }; r.readAsText(f);
    };
  }
}
function buildFilters(){
  const cats=["all",...new Set(DATA.rows.map(r=>r.category||"other"))];
  document.getElementById("filters").innerHTML = cats.map(c=>
    `<button data-c="${esc(c)}" aria-pressed="${c===CAT}">${esc(c)}</button>`).join("");
  document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{
    CAT=b.dataset.c; buildFilters(); render();});
}
// Pack size + per-unit line under the shelf price: "200 g · 145 Kč/kg".
const UNIT = {kg:"kg", l:"l", piece:"ks", roll:"roll", egg:"egg", pack:"pack"};
function packLabel(q, unit){
  if(!q || unit==="pack") return "";
  const n = x => (+x.toFixed(3)).toLocaleString("cs-CZ");
  if(unit==="kg") return q < 1 ? `${n(q*1000)} g` : `${n(q)} kg`;
  if(unit==="l") return q < 1 ? `${n(q*1000)} ml` : `${n(q)} l`;
  if(unit==="piece") return `${n(q)} ks`;
  return `${n(q)} ${unit}${q==1?'':'s'}`;
}
function unitLine(price, unitPrice, q, unit, amount){
  if(unit==="pack") return amount ? esc(amount) : "";
  const pack = amount ? esc(amount) : packLabel(q, unit);
  const per = q && q != 1 ? `${CZK(unitPrice)}/${UNIT[unit]||unit}` : "";
  return [pack, per].filter(Boolean).join(" · ");
}
const dm = iso => iso ? `${+iso.slice(8,10)}. ${+iso.slice(5,7)}.` : "";
// Best current flyer deal for the row (Kupi aggregates chain flyers; not a store column).
function inCart(r, store, kind){ const c = DATA.cart?.[r.key]; return !!c && c.store_id===store && c.kind===kind; }
// A price cell: tap = toggle on the shopping list (when served), ↗ = the store's page.
function cellHtml(r, store, kind, cls, title, inner, url){
  const on = LIVE && inCart(r, store, kind);
  const body = LIVE
    ? `<button class="pick" data-row="${esc(r.key)}" data-store="${esc(store)}" data-kind="${kind}" aria-pressed="${on}"
         title="${on?'on your list, tap to remove':'add to shopping list'}">${inner}${on?'<span class="inlist">✓ on list</span>':''}</button>`
    : inner;
  const ext = url ? `<a class="ext" href="${esc(url)}" target="_blank" rel="noopener" title="open at the store">↗</a>` : "";
  return `<td class="cell ${cls} ${on?'incart':''}" title="${esc(title)}">${body}${ext}</td>`;
}
function flyerCell(r){
  const d = r.deal;
  if(!d) return `<td class="flyer empty">·</td>`;
  const card = d.club ? `<span class="pill club" title="${esc(d.club)}">requires card</span>` : "";
  const line = unitLine(d.price_incl, d.unit_price, d.price_incl/d.unit_price, r.unit, d.amount);
  return cellHtml(r, d.store_id, "flyer", `flyer ${d.is_cheapest?'win':''}`,
    [d.product_name, d.club, d.note].filter(Boolean).join(' · '),
    `<b>${CZK(d.price_incl)}</b>${card}<span class="tot">${esc(d.store_name||d.store_id)}${d.valid_to?' · do '+dm(d.valid_to):''}</span>`
      + (line ? `<span class="tot">${line}</span>` : ""),
    d.url);
}

function render(){
  const rows = DATA.rows.filter(r=>CAT==="all"||(r.category||"other")===CAT);
  // only columns that have at least one price in view, busiest store first
  const count = s => rows.filter(r=>r.cells[s.id]).length;
  if(!rows.length){ document.getElementById("list").innerHTML = '<div class="loader">Nothing matched yet — go to Match.</div>'; return; }
  const stores = DATA.stores.filter(s=>count(s)>0).sort((a,b)=>count(b)-count(a));
  const head = `<tr><th class="row">item</th><th class="flyer">flyer deal · kupi.cz</th>`
    + `${stores.map(s=>`<th>${esc(s.name)}</th>`).join("")}</tr>`;
  const body = rows.map(r=>{
    const tds = stores.map(s=>{
      const c=r.cells[s.id];
      if(!c) return `<td class="empty">·</td>`;
      const line = unitLine(c.price_incl, c.unit_price, c.unit_qty, r.unit, "");
      const perPack = line ? `<span class="tot">${line}</span>` : "";
      const promo = (c.is_promo ? `<span class="pill" title="${c.promo_until?'do '+esc(c.promo_until):''}">akce</span>` : "")
        + (c.club ? `<span class="pill club" title="${esc(c.club)}">requires card</span>` : "");
      return cellHtml(r, s.id, "store", c.is_cheapest?'win':'',
        [c.offering_name, c.club, c.note, 'via '+c.source+' · '+c.ts].filter(Boolean).join(' · '),
        `<b>${CZK(c.price_incl)}</b>${promo}${perPack}`, c.url);
    }).join("");
    const ci = LIVE && DATA.cart?.[r.key];
    const where = ci ? `<div class="onlist">on list · ${esc((DATA.stores.find(s=>s.id===ci.store_id)||{}).name
                        || (r.deal && r.deal.store_id===ci.store_id && r.deal.store_name) || ci.store_id)}${ci.kind==='flyer'?' (flyer)':''}</div>` : "";
    return `<tr><td class="row"><div class="nm">${esc(r.name)}</div><div class="per">${r.unit==="pack" ? "compared per pack" : "compared per "+esc(UNIT[r.unit]||r.unit)}</div>${where}</td>`
      + `${flyerCell(r)}${tds}</tr>`;
  }).join("");
  const keepX = document.querySelector("#list .scroll")?.scrollLeft || 0;
  document.getElementById("list").innerHTML =
    `<div class="scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  document.querySelector("#list .scroll").scrollLeft = keepX;
  document.querySelectorAll("#list .pick").forEach(b=>b.onclick=()=>toggle(b));
  navCount();
}
function navCount(){
  const n = Object.keys(DATA.cart||{}).length;
  document.getElementById("navList").textContent = n ? `List (${n})` : "List";
}
async function toggle(b){
  b.disabled = true;
  try{
    const r = await kosikFetch("cart/toggle", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({row_key:b.dataset.row, store_id:b.dataset.store, kind:b.dataset.kind})});
    const d = await r.json();
    if(!r.ok || d.error) throw new Error(d.error || r.statusText);
    DATA.cart = DATA.cart || {};
    if(d.in_cart) DATA.cart[b.dataset.row] = {store_id:b.dataset.store, kind:b.dataset.kind};
    else delete DATA.cart[b.dataset.row];
    render();
  }catch(e){ alert("Couldn't update the list: " + e.message); b.disabled = false; }
}
load();
</script>
</body>
</html>
