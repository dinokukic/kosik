<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Košík list</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Košík<small>shopping list, by store</small></h1>
    <nav><a href="./">Matrix</a><a href="match.html">Match</a><a href="list.html" aria-current="page">List</a></nav>
  </header>
  <div class="printhead" id="printhead"></div>
  <div class="meta" id="meta"></div>
  <div class="toolbar noprint viewbar" id="viewbar" hidden>
    <span id="viewing"></span>
    <button class="btn ghost" id="back">← Back to current list</button>
    <button class="btn" id="printSaved">Print</button>
    <button class="btn ghost" id="reuseSaved">Use again</button>
  </div>
  <div class="toolbar noprint" id="toolbar" hidden>
    <button class="btn" id="print">Print</button>
    <button class="btn ghost" id="save">Save list &amp; start new</button>
    <button class="btn ghost" id="clearChecked">Remove ticked</button>
    <button class="btn ghost danger" id="clearAll">Clear list</button>
    <span class="status" id="status"></span>
  </div>
  <div id="stores"></div>
  <section class="compare noprint" id="compare" hidden>
    <h2>What this list would cost <label class="fl"><input type="checkbox" id="withFlyers" checked> include flyer deals</label></h2>
    <p class="headline" id="compareHead"></p>
    <div class="bars" id="compareBars"></div>
    <div class="tips" id="tips" hidden><h3>Tweak your list</h3><ul id="tipList"></ul></div>
    <p class="hint" id="compareNote"></p>
  </section>
  <section class="saved noprint" id="saved" hidden>
    <h2>Saved lists</h2>
    <ul id="savedList"></ul>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CZK = n => n.toLocaleString("cs-CZ",{minimumFractionDigits:2,maximumFractionDigits:2}) + " Kč";
const dm = iso => iso ? `${+iso.slice(8,10)}. ${+iso.slice(5,7)}.` : "";
let ITEMS = [], VIEW = null;  // VIEW = a saved list being looked at (read-only), else the current list

async function api(path, body){
  const r = await kosikFetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"},
                                               body:JSON.stringify(body)} : {});
  const d = await r.json().catch(()=>({error:"server not running? start: python3 pricetrack.py serve"}));
  if(!r.ok || d.error) throw new Error(d.error || r.statusText);
  return d;
}

async function load(){
  try{ ITEMS = (await api("cart")).items; VIEW = null; render(); loadSaved(); }
  catch(e){
    $("stores").innerHTML = `<div class="loader">Couldn't reach the local server (${esc(e.message)}).<br>
      Start it with <code>python3 pricetrack.py serve</code> and open <code>localhost:8765/list.html</code>.</div>`;
  }
}

function line(it, ro){
  const price = it.price_incl ?? 0;
  const changed = it.current_price != null && Math.abs(it.current_price - price) > 0.005;
  const gone = it.current_price == null;
  const notes = [
    it.kind === "flyer" ? "flyer · kupi.cz" : "",
    it.promo_until ? `akce do ${dm(it.promo_until)}` : "",
    it.club ? "requires card" : "",
    it.note && it.kind !== "flyer" ? it.note : "",
  ].filter(Boolean);
  const drift = ro ? "" : gone ? `<span class="drift">no longer listed at this price</span>`
    : changed ? `<span class="drift">now ${CZK(it.current_price)}</span>` : "";
  return `<li class="item ${it.checked?'done':''}">
    <label class="tick"><input type="checkbox" ${ro?'':`data-check="${it.id}"`} ${it.checked&&!ro?'checked':''}>
      <span class="what"><span class="nm">${esc(it.row_name)}</span>
        <span class="sub">${esc(it.item_name||"")}${it.amount?' · '+esc(it.amount):''} · ${CZK(price)} each${notes.length?' · '+esc(notes.join(' · ')):''} ${drift}</span>
      </span></label>
    <span class="qty">${ro?'':`<button class="q noprint" data-dec="${it.id}" aria-label="one less">−</button>`}<b>${it.qty}×</b>${ro?'':`<button class="q noprint" data-inc="${it.id}" aria-label="one more">+</button>`}</span>
    <span class="sum">${CZK(price * it.qty)}</span>
    ${ro?'':`<button class="x noprint" data-del="${it.id}" aria-label="remove" title="remove">×</button>`}
  </li>`;
}

// ---- cheapest / efficient run / average / most expensive, your picks, and tips (edge: /api/scenarios)
const signed = n => `${n > 0 ? "+" : n < 0 ? "−" : ""}${CZK(Math.abs(n))}`;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
async function loadCompare(){
  const box = $("compare");
  const items = VIEW ? VIEW.items : ITEMS;
  if(!items.length){ box.hidden = true; return; }
  const q = (VIEW ? `saved=${VIEW.id}&` : "") + `flyers=${$("withFlyers").checked ? 1 : 0}`;
  const d = await api("scenarios?" + q).catch(()=>null);
  if(!d || !d.scenarios){ box.hidden = true; return; }  // not available (e.g. local server)
  const s = d.scenarios, base = s.cheapest.total, avg = s.average.total, yours = VIEW ? null : s.your_picks.total;

  // headline: your picks against the average and the cheapest possible
  $("compareHead").innerHTML = yours == null
    ? `Cheapest possible <b>${CZK(base)}</b>, average <b>${CZK(avg)}</b>, most expensive <b>${CZK(s.most_expensive.total)}</b>.`
    : `Your picks come to <b>${CZK(yours)}</b>: ` +
      (yours <= avg ? `<b class="good">${CZK(avg - yours)} (${Math.round((1 - yours / avg) * 100)} %) under the average</b>`
                    : `<b class="warn">${CZK(yours - avg)} over the average</b>`) +
      (yours - base > 0.5 ? `, ${CZK(yours - base)} above the cheapest possible.` : `, the cheapest possible.`) +
      ` The spread between cheapest and most expensive is ${CZK(s.most_expensive.total - base)}.`;

  // bars, cheapest to most expensive
  const bars = [
    { label: "Cheapest", sub: `${plural(s.cheapest.stores, "store")}: ${s.cheapest.list.join(", ")}`, total: base, moves: s.cheapest.moves },
    // only combinations that get everything: a partial one looks cheap because it leaves items out
    ...s.efficient.filter(e => e.covered === e.of && e.k < s.cheapest.stores)
      .map(e => ({ label: e.k === 1 ? "One stop" : `Best ${e.k} stores`, sub: e.stores.join(" + "), total: e.total, moves: e.moves })),
    { label: "Average", sub: "each item at an average store", total: avg },
    { label: "Most expensive", sub: "each item at its priciest store", total: s.most_expensive.total },
    ...(VIEW ? [] : [{ label: "Your picks", sub: "the stores on this list", total: yours, mine: true,
      warn: s.your_picks.missing ? `${s.your_picks.missing} not priced now` : "" }]),
  ].filter(b => b.total != null).sort((a, b) => a.total - b.total || (a.mine ? -1 : 0));
  const max = Math.max(...bars.map(b => b.total));
  const APPLY = [];
  $("compareBars").innerHTML = bars.map(b => {
    const diff = Math.abs(b.total - base) < 0.005 ? "cheapest" : `${signed(b.total - base)}${b.total / base - 1 >= 0.01 ? ` (+${Math.round((b.total / base - 1) * 100)} %)` : ""}`;
    const use = !VIEW && b.moves && b.moves.length ? `<button class="btn ghost small" data-apply="${APPLY.push({moves: b.moves, what: b.label.toLowerCase()}) - 1}">Use this</button>` : "";
    return `<div class="bar ${b.mine ? "mine" : ""}">
      <div class="bl"><b>${esc(b.label)}</b><span>${esc(b.sub)}${b.warn ? ` <span class="warn">(${esc(b.warn)})</span>` : ""}</span></div>
      <div class="bt"><i style="width:${(b.total / max * 100).toFixed(1)}%"></i></div>
      <div class="bv"><b>${CZK(b.total)}</b><span>${diff}</span>${use}</div></div>`;
  }).join("");

  // tips: cheaper at a store you visit anyway / one stop fewer
  const tips = VIEW ? [] : d.tips || [];
  $("tips").hidden = !tips.length;
  $("tipList").innerHTML = tips.map(t => {
    const list = esc(t.items.join(", ")), to = esc(t.to.join(" and "));
    const cost = t.delta < -0.005 ? `<b class="good">save ${CZK(-t.delta)}</b>` : t.delta > 0.005 ? `<b>${signed(t.delta)}</b>` : "<b>same price</b>";
    const text = t.kind === "cheaper"
      ? `<b>${plural(t.items.length, "item")} cheaper at stores you're already visiting.</b> Move ${list} to ${to}.`
      : `<b>${t.items.length <= 3 ? "Only " : ""}${plural(t.items.length, "item")} at ${esc(t.store)}.</b> Get ${list} at ${to} instead: one stop fewer.`;
    return `<li><span class="tt">${text}</span><span class="tc">${cost}</span>
      <button class="btn small" data-apply="${APPLY.push({moves: t.moves, what: t.kind === "drop" ? `skipping ${t.store}` : "the cheaper stores"}) - 1}">Apply changes</button></li>`;
  }).join("");
  box.querySelectorAll("[data-apply]").forEach(b => b.onclick = () => applyMoves(APPLY[+b.dataset.apply], b));

  $("compareNote").textContent = `${d.priced} of ${d.items} items priced` +
    (d.only_one_store ? `, ${d.only_one_store} sold by only one store (same cost in every row)` : "") +
    ". Each item is costed on the same reference pack × price per unit, so pack sizes don't skew stores. " +
    "Store combinations are picked by how many items they cover, then by total. Applying a change keeps your quantities.";
  box.hidden = false;
}
async function applyMoves({moves, what}, btn){
  const n = moves.length;
  if(n > 3 && !confirm(`Move ${n} items on your list (${what})?`)) return;
  btn.disabled = true;
  try{
    const r = await api("cart/move", {moves: moves.map(({row_key, to, kind}) => ({row_key, store_id: to, kind}))});
    $("status").textContent = `Moved ${plural(r.moved, "item")}.`;
    await load();
  }catch(e){ $("status").textContent = e.message; btn.disabled = false; }
}
$("withFlyers").onchange = loadCompare;

let compareTimer = null;
function render(){
  const ro = !!VIEW, items = ro ? VIEW.items : ITEMS;
  clearTimeout(compareTimer); compareTimer = setTimeout(loadCompare, 400);  // ticks/qty changes re-render often
  $("viewbar").hidden = !ro;
  $("saved").hidden = ro || !$("savedList").children.length;
  if(ro) $("viewing").innerHTML = `<b>${esc(VIEW.name)}</b> · saved ${esc(VIEW.created.replace("T"," "))}`;
  const byStore = {};
  items.forEach(it => (byStore[it.store_name || it.store_id] ??= []).push(it));
  const groups = Object.entries(byStore).sort((a,b)=>b[1].length-a[1].length || a[0].localeCompare(b[0]));
  const total = items.reduce((s,it)=>s + (it.price_incl||0)*it.qty, 0);
  const left = items.filter(it=>!it.checked).length;
  $("toolbar").hidden = ro || !items.length;
  $("meta").textContent = items.length
    ? `${items.length} items · ${groups.length} stores${ro?'':` · ${left} still to get`} · total ${CZK(total)}${ro?' (prices when saved)':''}`
    : "";
  $("printhead").textContent = ro ? `${VIEW.name} · ${CZK(total)}`
    : `Nákupní seznam · ${new Date().toLocaleDateString("cs-CZ")} · ${CZK(total)}`;
  if(!items.length){
    $("stores").innerHTML = `<div class="loader">Your list is empty. Tap prices on the <a href="./">Matrix</a> to add items at a store.</div>`;
    return;
  }
  $("stores").innerHTML = groups.map(([store, items])=>{
    const sub = items.reduce((s,it)=>s + (it.price_incl||0)*it.qty, 0);
    const done = items.filter(it=>it.checked).length;
    const ordered = ro ? items : [...items].sort((a,b)=>a.checked-b.checked);  // ticked sink to the bottom
    return `<section class="storegroup">
      <h2>${esc(store)}<small>${items.length} item${items.length>1?'s':''}${done?` · ${done} done`:''} · ${CZK(sub)}</small></h2>
      <ul class="todo">${ordered.map(it=>line(it, ro)).join("")}</ul></section>`;
  }).join("") + `<p class="grand">Total <b>${CZK(total)}</b></p>`;
  document.querySelectorAll("[data-check]").forEach(x=>x.onchange=()=>update(+x.dataset.check, {checked:x.checked}));
  document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>bump(+b.dataset.inc, 1));
  document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>bump(+b.dataset.dec, -1));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>remove({id:+b.dataset.del}));
}

async function update(id, change){
  const it = ITEMS.find(x=>x.id===id); Object.assign(it, change); render();  // optimistic
  try{ await api("cart/update", {id, ...change}); }
  catch(e){ $("status").textContent = e.message; load(); }
}
function bump(id, d){
  const it = ITEMS.find(x=>x.id===id);
  if(it.qty + d < 1) return;
  update(id, {qty: it.qty + d});
}
async function remove(body){
  try{ await api("cart/remove", body); await load(); }
  catch(e){ $("status").textContent = e.message; }
}
$("print").onclick = () => window.print();

// ---- saved lists
async function loadSaved(){
  const d = await api("lists").catch(()=>({lists:[]}));
  $("savedList").innerHTML = d.lists.map(l=>`<li>
    <span class="nm">${esc(l.name)}</span>
    <span class="sub">${esc(l.created.slice(0,10))} · ${l.count} items · ${CZK(l.total||0)}</span>
    <span class="acts"><button class="btn ghost" data-open="${l.id}">Open</button>
      <button class="btn ghost" data-reuse="${l.id}">Use again</button>
      <button class="x" data-deletelist="${l.id}" title="delete">×</button></span></li>`).join("");
  $("saved").hidden = !!VIEW || !d.lists.length;
  $("savedList").querySelectorAll("[data-open]").forEach(b=>b.onclick=async()=>{
    VIEW = await api("list?id="+b.dataset.open); render(); scrollTo(0,0);
  });
  $("savedList").querySelectorAll("[data-reuse]").forEach(b=>b.onclick=()=>reuse(+b.dataset.reuse));
  $("savedList").querySelectorAll("[data-deletelist]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Delete this saved list?")) return;
    await api("lists/delete", {id:+b.dataset.deletelist}); loadSaved();
  });
}
async function reuse(id){
  try{
    const d = await api("lists/reuse", {id});
    $("status").textContent = d.added ? `Added ${d.added} items at today's prices.` : "Everything was already on the list.";
    await load();
  }catch(e){ $("status").textContent = e.message; }
}
$("save").onclick = async ()=>{
  const name = prompt("Name this list:", `Nákup ${new Date().toLocaleDateString("cs-CZ")}`);
  if(name === null) return;
  try{ await api("cart/save", {name}); $("status").textContent = "Saved. The list is empty again."; await load(); }
  catch(e){ $("status").textContent = e.message; }
};
$("back").onclick = () => { VIEW = null; render(); loadSaved(); };
$("printSaved").onclick = () => window.print();
$("reuseSaved").onclick = () => reuse(VIEW.id);
$("clearChecked").onclick = () => remove({checked_only:true});
$("clearAll").onclick = () => { if(confirm("Clear the whole list?")) remove({all:true}); };
load();
</script>
</body>
</html>
